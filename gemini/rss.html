<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy RSS Reader + Debug</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
        .console-text { font-family: 'Courier New', Courier, monospace; }
        #debug-console-content::-webkit-scrollbar { width: 4px; }
        #debug-console-content::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-20">

    <div id="app" class="min-h-screen">
        <!-- Header -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 shadow-sm">
            <div class="max-w-6xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="flex items-center gap-2">
                    <div class="bg-emerald-600 p-2 rounded-lg text-white">
                        <i data-lucide="shield-check" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight leading-none">Privacy Reader</h1>
                        <span class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest">Direct Connection</span>
                    </div>
                </div>

                <div class="flex flex-1 max-w-md gap-2">
                    <div class="relative flex-1">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i>
                        <input id="search-input" type="text" placeholder="Search articles..." class="w-full pl-10 pr-4 py-2 bg-slate-100 border-none rounded-full text-sm focus:ring-2 focus:ring-emerald-500 outline-none transition-all" />
                    </div>
                    <button onclick="toggleModal(true)" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-full flex items-center gap-2 text-sm font-medium transition-colors">
                        <i data-lucide="plus" class="w-4 h-4"></i> Add
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-6xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Sidebar -->
            <aside class="lg:col-span-3 space-y-6">
                <div class="bg-emerald-50 rounded-xl p-4 border border-emerald-100">
                    <h3 class="text-xs font-bold text-emerald-800 uppercase mb-2 flex items-center gap-2">
                        <i data-lucide="info" class="w-3 h-3"></i> Privacy Mode
                    </h3>
                    <p class="text-[11px] text-emerald-700 leading-relaxed">
                        Direct connections only. No third-party proxies are used. Feeds will only load if the publisher supports CORS.
                    </p>
                </div>

                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                        <i data-lucide="rss" class="w-3.5 h-3.5"></i> Sources
                    </h2>
                    <div id="feeds-list" class="space-y-1"></div>
                </div>

                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                        <i data-lucide="tag" class="w-3.5 h-3.5"></i> Tags
                    </h2>
                    <div id="tags-list" class="flex flex-wrap gap-2"></div>
                </div>

                <div id="status-bar" class="text-[10px] text-slate-400 uppercase tracking-widest px-2 font-bold flex items-center gap-2">
                    <i data-lucide="clock" class="w-3 h-3"></i> Syncing...
                </div>
            </aside>

            <!-- Articles Feed -->
            <section class="lg:col-span-9 space-y-4">
                <div class="flex items-center justify-between mb-2">
                    <div id="article-count" class="text-sm font-medium text-slate-500">
                        Initializing...
                    </div>
                    <button onclick="refreshAllFeeds()" class="text-emerald-600 hover:text-emerald-700 text-sm font-medium flex items-center gap-1">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Sync
                    </button>
                </div>

                <div id="articles-container" class="space-y-4"></div>
            </section>
        </main>

        <!-- Debug Console (Fixed Bottom) -->
        <div id="debug-console" class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900 text-slate-300 border-t border-slate-700 transition-all duration-300 translate-y-[calc(100%-40px)]">
            <div onclick="toggleDebugConsole()" class="h-10 px-4 flex items-center justify-between cursor-pointer hover:bg-slate-800 border-b border-slate-800">
                <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider">
                    <i data-lucide="terminal" class="w-3.5 h-3.5 text-emerald-500"></i>
                    <span>System Console</span>
                    <span id="log-count" class="ml-2 bg-slate-700 px-1.5 py-0.5 rounded text-[10px]">0</span>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="clearLogs(event)" class="text-[10px] text-slate-500 hover:text-white uppercase font-bold">Clear</button>
                    <i id="console-chevron" data-lucide="chevron-up" class="w-4 h-4"></i>
                </div>
            </div>
            <div id="debug-console-content" class="h-64 overflow-y-auto p-4 console-text text-[11px] space-y-1">
                <!-- Logs injected here -->
            </div>
        </div>

        <!-- Add Modal -->
        <div id="add-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
            <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
                <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                    <h2 class="text-lg font-bold">Add New Feed</h2>
                    <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <form id="add-feed-form" class="p-6 space-y-4">
                    <div class="space-y-1">
                        <div class="flex justify-between items-center">
                            <label class="text-xs font-bold text-slate-400 uppercase ml-1">Feed URL</label>
                            <button type="button" onclick="testCurrentUrl()" class="text-[10px] text-emerald-600 font-bold uppercase hover:underline">Test Connection</button>
                        </div>
                        <input required id="feed-url-input" type="url" placeholder="https://..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 outline-none" />
                    </div>
                    <div id="test-result" class="hidden text-[11px] p-2 rounded-lg"></div>
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-400 uppercase ml-1">Tags (comma separated)</label>
                        <input id="feed-tags-input" type="text" placeholder="news, tech" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 outline-none" />
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg">Save Feed</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // --- System Logs Interceptor ---
        const originalConsole = {
            log: console.log,
            error: console.error,
            warn: console.warn
        };

        let state = {
            feeds: JSON.parse(localStorage.getItem('privacy_rss_debug') || '[]'),
            articles: [],
            isRefreshing: false,
            logs: [],
            filters: { search: '', tag: 'All', feedId: 'all' },
            isConsoleOpen: false
        };

        function addLog(type, ...args) {
            const message = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ');
            const timestamp = new Date().toLocaleTimeString();
            state.logs.push({ type, message, timestamp });
            renderLogs();
        }

        console.log = (...args) => {
            addLog('log', ...args);
            originalConsole.log.apply(console, args);
        };
        console.error = (...args) => {
            addLog('error', ...args);
            originalConsole.error.apply(console, args);
        };
        console.warn = (...args) => {
            addLog('warn', ...args);
            originalConsole.warn.apply(console, args);
        };

        // --- Core Functions ---
        const feedsListEl = document.getElementById('feeds-list');
        const tagsListEl = document.getElementById('tags-list');
        const articlesContainerEl = document.getElementById('articles-container');
        const statusBar = document.getElementById('status-bar');
        const debugConsole = document.getElementById('debug-console');
        const debugContent = document.getElementById('debug-console-content');
        const testResultEl = document.getElementById('test-result');

        function init() {
            lucide.createIcons();
            document.getElementById('search-input').addEventListener('input', (e) => {
                state.filters.search = e.target.value;
                render();
            });
            document.getElementById('add-feed-form').addEventListener('submit', handleAddFeed);
            
            console.log("Privacy RSS Reader initialized. Mode: Direct Egress.");
            
            setInterval(() => refreshAllFeeds(), 5 * 60 * 1000);
            refreshAllFeeds();
        }

        async function testCurrentUrl() {
            const url = document.getElementById('feed-url-input').value;
            if (!url) return;

            testResultEl.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-emerald-100', 'text-emerald-700');
            testResultEl.classList.add('bg-slate-100', 'text-slate-600');
            testResultEl.textContent = "Testing direct fetch...";
            
            console.log(`Testing connection to: ${url}`);

            try {
                const response = await fetch(url, { method: 'GET', mode: 'cors' });
                if (response.ok) {
                    const text = await response.text();
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(text, "text/xml");
                    const items = xml.querySelectorAll('item');
                    
                    if (items.length > 0) {
                        testResultEl.className = "text-[11px] p-2 rounded-lg bg-emerald-100 text-emerald-700";
                        testResultEl.textContent = `Success! Found ${items.length} articles. Publisher supports CORS.`;
                        console.log(`Test success: ${url} returned ${items.length} items.`);
                    } else {
                        throw new Error("Connected, but no RSS items found.");
                    }
                } else {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
            } catch (e) {
                testResultEl.className = "text-[11px] p-2 rounded-lg bg-red-100 text-red-700";
                testResultEl.textContent = `Failed: ${e.message}. Likely blocked by CORS policy.`;
                console.error(`Test failed for ${url}: ${e.message}`);
            }
        }

        async function refreshAllFeeds() {
            if (state.isRefreshing || state.feeds.length === 0) {
                if(state.feeds.length === 0) render();
                return;
            }
            
            state.isRefreshing = true;
            statusBar.innerHTML = `<i data-lucide="refresh-cw" class="w-3 h-3 animate-spin"></i> Syncing...`;
            lucide.createIcons();

            let allArticles = [];

            for (const feed of state.feeds) {
                try {
                    console.log(`Fetching feed: ${feed.url}`);
                    const response = await fetch(feed.url, { method: 'GET', mode: 'cors' });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const text = await response.text();
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(text, "text/xml");
                    
                    const channelTitle = xml.querySelector('channel > title')?.textContent || feed.url.split('/')[2];
                    const items = xml.querySelectorAll('item');

                    Array.from(items).forEach(item => {
                        allArticles.push({
                            id: item.querySelector('guid')?.textContent || item.querySelector('link')?.textContent,
                            title: item.querySelector('title')?.textContent || 'Untitled',
                            link: item.querySelector('link')?.textContent,
                            description: (item.querySelector('description')?.textContent || '').replace(/<[^>]*>?/gm, '').substring(0, 200),
                            pubDate: new Date(item.querySelector('pubDate')?.textContent || Date.now()),
                            feedId: feed.id,
                            feedTitle: channelTitle,
                            tags: feed.tags || []
                        });
                    });
                } catch (e) {
                    console.error(`Fetch Error [${feed.url}]: ${e.message}`);
                }
            }

            allArticles.sort((a, b) => b.pubDate - a.pubDate);
            state.articles = allArticles;
            state.isRefreshing = false;
            statusBar.innerHTML = `<i data-lucide="check" class="w-3 h-3 text-emerald-500"></i> Updated: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
            lucide.createIcons();
            render();
        }

        function handleAddFeed(e) {
            e.preventDefault();
            const url = document.getElementById('feed-url-input').value;
            const tags = document.getElementById('feed-tags-input').value.split(',').map(t => t.trim()).filter(t => t);
            
            state.feeds.push({ id: Date.now().toString(), url, tags });
            localStorage.setItem('privacy_rss_debug', JSON.stringify(state.feeds));
            console.log(`Added new feed: ${url}`);
            toggleModal(false);
            e.target.reset();
            refreshAllFeeds();
        }

        window.deleteFeed = (id) => {
            const feed = state.feeds.find(f => f.id === id);
            console.log(`Deleted feed: ${feed?.url}`);
            state.feeds = state.feeds.filter(f => f.id !== id);
            localStorage.setItem('privacy_rss_debug', JSON.stringify(state.feeds));
            refreshAllFeeds();
        };

        function render() {
            renderFeeds();
            renderTags();
            renderArticles();
        }

        function renderLogs() {
            document.getElementById('log-count').textContent = state.logs.length;
            debugContent.innerHTML = state.logs.map(log => {
                const color = log.type === 'error' ? 'text-red-400' : (log.type === 'warn' ? 'text-yellow-400' : 'text-slate-400');
                return `<div class="pb-1"><span class="text-slate-600">[${log.timestamp}]</span> <span class="${color}">${log.message}</span></div>`;
            }).join('');
            debugContent.scrollTop = debugContent.scrollHeight;
        }

        window.clearLogs = (e) => {
            e.stopPropagation();
            state.logs = [];
            renderLogs();
        };

        window.toggleDebugConsole = () => {
            state.isConsoleOpen = !state.isConsoleOpen;
            const chevron = document.getElementById('console-chevron');
            if (state.isConsoleOpen) {
                debugConsole.style.transform = "translateY(0)";
                chevron.style.transform = "rotate(180deg)";
            } else {
                debugConsole.style.transform = "translateY(calc(100% - 40px))";
                chevron.style.transform = "rotate(0deg)";
            }
        };

        function renderFeeds() {
            feedsListEl.innerHTML = `
                <button onclick="state.filters.feedId='all';render()" class="w-full text-left px-3 py-2 rounded-lg text-sm ${state.filters.feedId === 'all' ? 'bg-emerald-50 text-emerald-700 font-bold' : 'hover:bg-slate-100'}">All Sources</button>
            ` + state.feeds.map(f => `
                <div class="group flex items-center justify-between">
                    <button onclick="state.filters.feedId='${f.id}';render()" class="flex-1 text-left px-3 py-2 rounded-lg text-sm truncate ${state.filters.feedId === f.id ? 'bg-emerald-50 text-emerald-700 font-bold' : 'hover:bg-slate-100'}">
                        ${f.url.split('/')[2]}
                    </button>
                    <button onclick="deleteFeed('${f.id}')" class="p-1 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function renderTags() {
            const tags = new Set(['All']);
            state.feeds.forEach(f => f.tags?.forEach(t => tags.add(t)));
            tagsListEl.innerHTML = Array.from(tags).map(tag => `
                <button onclick="state.filters.tag='${tag}';render()" class="px-3 py-1 rounded-full text-xs font-medium border ${state.filters.tag === tag ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-200 hover:border-slate-400'}">${tag}</button>
            `).join('');
        }

        function renderArticles() {
            const filtered = state.articles.filter(a => {
                const search = state.filters.search.toLowerCase();
                const matchesSearch = a.title.toLowerCase().includes(search) || a.description.toLowerCase().includes(search);
                const matchesTag = state.filters.tag === 'All' || a.tags.includes(state.filters.tag);
                const matchesFeed = state.filters.feedId === 'all' || a.feedId === state.filters.feedId;
                return matchesSearch && matchesTag && matchesFeed;
            });

            document.getElementById('article-count').textContent = `Showing ${filtered.length} articles`;

            if (filtered.length === 0) {
                articlesContainerEl.innerHTML = `
                    <div class="bg-white rounded-3xl p-16 text-center border-2 border-dashed border-slate-200">
                        <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-4 text-slate-100"></i>
                        <h3 class="text-lg font-bold text-slate-800">No content found</h3>
                        <p class="text-slate-500 mt-1 max-w-xs mx-auto text-sm italic">Direct connection is active. Some sites may block browser access (CORS). Open console below to see errors.</p>
                    </div>
                `;
            } else {
                articlesContainerEl.innerHTML = filtered.map(a => `
                    <article class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-emerald-200 transition-all group">
                        <div class="flex items-start justify-between gap-4">
                            <div class="space-y-1">
                                <div class="flex items-center gap-2 text-[10px] font-bold text-emerald-600 uppercase tracking-widest">
                                    <span>${a.feedTitle}</span>
                                    <span class="text-slate-300">•</span>
                                    <span class="text-slate-400 font-medium normal-case">${a.pubDate.toLocaleDateString([], {month:'short', day:'numeric'})}</span>
                                </div>
                                <a href="${a.link}" target="_blank" class="block group-hover:text-emerald-700 transition-colors">
                                    <h3 class="text-lg font-bold leading-snug">${a.title}</h3>
                                </a>
                                <p class="text-slate-600 text-sm leading-relaxed line-clamp-2">${a.description}</p>
                            </div>
                            <a href="${a.link}" target="_blank" class="p-3 bg-slate-50 text-slate-400 rounded-xl hover:bg-emerald-50 hover:text-emerald-600 transition-all"><i data-lucide="external-link" class="w-5 h-5"></i></a>
                        </div>
                    </article>
                `).join('');
            }
            lucide.createIcons();
        }

        window.toggleModal = (show) => {
            document.getElementById('add-modal').classList.toggle('hidden', !show);
            testResultEl.classList.add('hidden');
            if (show) document.getElementById('feed-url-input').focus();
        };

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manifold Engine v7.0 - Voronoi</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #010206; font-family: 'Inter', sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .glass-panel { background: rgba(8, 12, 22, 0.85); backdrop-filter: blur(28px) saturate(200%); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9); }
        #controls-content { max-height: 0; opacity: 0; overflow: hidden; transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease; }
        #controls-container.expanded #controls-content { max-height: 1000px; opacity: 1; padding-bottom: 2rem; }
        .slider-input { -webkit-appearance: none; width: 100%; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 5px; outline: none; }
        .slider-input::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #6366f1; border-radius: 50%; cursor: pointer; border: 2px solid #ffffff; }
        .btn-primary { background: #4f46e5; transition: all 0.2s ease; }
        .btn-primary:hover { background: #6366f1; transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(1px); }
    </style>
</head>
<body>

    <div id="canvas-wrapper"></div>

    <!-- UI Panel -->
    <div id="controls-container" class="fixed top-8 left-8 w-80 glass-panel rounded-[2.5rem] z-50 transition-all duration-500 overflow-hidden">
        <button id="toggle-panel" class="w-full px-8 py-7 flex items-center justify-between text-left group outline-none">
            <div class="flex items-center gap-4">
                <div class="w-3 h-3 rounded-full bg-indigo-500 shadow-[0_0_15px_rgba(99,102,241,1)]"></div>
                <span class="text-[11px] font-black tracking-[0.35em] uppercase text-indigo-100">Fabrication Engine</span>
            </div>
            <svg id="chevron" class="w-5 h-5 text-slate-500 transition-transform duration-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
        </button>

        <div id="controls-content" class="px-8 space-y-8">
            <div class="space-y-3">
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Topology Pattern</label>
                <select id="mode-select" onchange="updateUniform('uMode', parseInt(this.value))" class="w-full bg-slate-900 border border-white/10 rounded-2xl p-4 text-xs font-bold text-indigo-100 outline-none hover:border-indigo-500/50 transition-colors">
                    <option value="0">Gyroid (Minimal Surface)</option>
                    <option value="1">Schwarz P (Pipe Mesh)</option>
                    <option value="2">Neovius (Cellular)</option>
                    <option value="3">3D Voronoi (Organic Skeleton)</option>
                </select>
            </div>

            <div class="space-y-3">
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Bounding Geometry</label>
                <select id="shape-select" onchange="updateUniform('uShape', parseInt(this.value))" class="w-full bg-slate-900 border border-white/10 rounded-2xl p-4 text-xs font-bold text-indigo-100 outline-none hover:border-indigo-500/50 transition-colors">
                    <option value="0">Rounded Cube</option>
                    <option value="1">Structural Sphere</option>
                    <option value="2">Pyramid</option>
                    <option value="3">Column Cylinder</option>
                </select>
            </div>

            <div class="space-y-7">
                <div class="space-y-3">
                    <div class="flex justify-between items-center text-[10px] font-bold text-slate-500 uppercase">
                        <span>Lattice Density</span>
                        <span id="val-density" class="text-indigo-400 font-mono">4.0</span>
                    </div>
                    <input id="input-density" type="range" min="1" max="12" step="0.1" value="4.0" oninput="updateUniform('uDensity', parseFloat(this.value)); document.getElementById('val-density').innerText = parseFloat(this.value).toFixed(1);" class="slider-input">
                </div>
                <div class="space-y-3">
                    <div class="flex justify-between items-center text-[10px] font-bold text-slate-500 uppercase">
                        <span>Wall Thickness</span>
                        <span id="val-thickness" class="text-indigo-400 font-mono">0.00</span>
                    </div>
                    <input id="input-thickness" type="range" min="-1.5" max="1.5" step="0.05" value="0.0" oninput="updateUniform('uThickness', parseFloat(this.value)); document.getElementById('val-thickness').innerText = parseFloat(this.value).toFixed(2);" class="slider-input">
                </div>
            </div>

            <div class="pt-8 border-t border-white/5 space-y-4">
                <button id="export-btn" class="w-full py-5 btn-primary text-white rounded-2xl text-[11px] font-black uppercase tracking-[0.2em] shadow-2xl active:scale-[0.98]">
                    Generate & Export STL
                </button>
                <div id="export-status" class="text-[9px] text-slate-500 text-center font-mono uppercase tracking-widest h-4">Ready</div>
            </div>
        </div>
    </div>

    <script id="vertexShader" type="x-shader/x-vertex">varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }</script>
    <script id="fragmentShader" type="x-shader/x-fragment">
        precision highp float;
        uniform float uTime; uniform vec2 uResolution; uniform float uDensity; uniform float uThickness; uniform int uMode; uniform int uShape;
        varying vec2 vUv;

        // Hash function for Voronoi seeds
        vec3 hash33(vec3 p) {
            p = fract(p * vec3(.1031, .1030, .0973));
            p += dot(p, p.yxz + 33.33);
            return fract((p.xxy + p.yxx) * p.zyx);
        }

        float sdVoronoi(vec3 p) {
            vec3 i = floor(p);
            vec3 f = fract(p);
            float d1 = 8.0, d2 = 8.0;
            for(int z=-1; z<=1; z++)
            for(int y=-1; y<=1; y++)
            for(int x=-1; x<=1; x++) {
                vec3 g = vec3(float(x), float(y), float(z));
                vec3 o = hash33(i + g);
                vec3 r = g + o - f;
                float d = dot(r, r);
                if(d < d1) { d2 = d1; d1 = d; }
                else if(d < d2) { d2 = d; }
            }
            return (sqrt(d2) - sqrt(d1)); // Distance between the two nearest seeds
        }

        float sdBox(vec3 p, vec3 b, float r) { vec3 q = abs(p) - b; return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0) - r; }
        float sdSphere(vec3 p, float s) { return length(p) - s; }
        float sdCylinder(vec3 p, vec2 h) { vec2 d = abs(vec2(length(p.xz),p.y)) - h; return min(max(d.x,d.y),0.0) + length(max(d,0.0)); }

        float getManifold(vec3 p) {
            vec3 q = p * uDensity;
            if (uMode == 0) return sin(q.x)*cos(q.y) + sin(q.y)*cos(q.z) + sin(q.z)*cos(q.x);
            if (uMode == 1) return cos(q.x) + cos(q.y) + cos(q.z);
            if (uMode == 2) return 3.0*(cos(q.x)+cos(q.y)+cos(q.z)) + 4.0*cos(q.x)*cos(q.y)*cos(q.z);
            if (uMode == 3) return sdVoronoi(p * (uDensity * 0.5)) * 4.0 - 1.0; 
            return 0.0;
        }

        float map(vec3 p) {
            float shapeDist = 0.0;
            if (uShape == 0) shapeDist = sdBox(p, vec3(1.2), 0.15);
            else if (uShape == 1) shapeDist = sdSphere(p, 1.5);
            else if (uShape == 2) shapeDist = (abs(p.x)+abs(p.y)+abs(p.z)-2.2)*0.577;
            else if (uShape == 3) shapeDist = sdCylinder(p, vec2(1.2, 1.4));
            
            float lattice = abs(getManifold(p) - uThickness) - 0.22;
            return max(shapeDist, lattice);
        }

        vec3 getNormal(vec3 p) { vec2 e = vec2(0.002, 0); return normalize(vec3(map(p+e.xyy)-map(p-e.xyy), map(p+e.yxy)-map(p-e.yxy), map(p+e.yyx)-map(p-e.yyx))); }

        void main() {
            vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / min(uResolution.y, uResolution.x);
            vec3 ro = vec3(0, 0, 5.0); vec3 rd = normalize(vec3(uv, -1.8));
            float t_y = uTime * 0.45; float t_x = sin(uTime * 0.2) * 0.25;
            mat3 rot = mat3(cos(t_y),0,sin(t_y), 0,1,0, -sin(t_y),0,cos(t_y)) * mat3(1,0,0, 0,cos(t_x),-sin(t_x), 0,sin(t_x),cos(t_x));
            ro = rot * ro; rd = rot * rd;
            float dist = 0.0; bool hit = false;
            for(int i=0; i<90; i++) { float d = map(ro + rd*dist); if(d < 0.001) { hit = true; break; } dist += d * 0.65; if(dist > 15.0) break; }
            vec3 color = vec3(0.012, 0.015, 0.02);
            if(hit) {
                vec3 p = ro + rd*dist; vec3 n = getNormal(p);
                float diff = max(dot(n, normalize(vec3(5,10,7))), 0.0);
                float rim = pow(1.0 - max(dot(n, -rd), 0.0), 4.0);
                color = mix(vec3(0.08, 0.12, 0.3), vec3(0.6, 0.8, 1.0), n.y * 0.5 + 0.5) * diff + vec3(1.0) * pow(diff, 64.0);
                color += vec3(0.4, 0.6, 1.0) * rim;
            }
            gl_FragColor = vec4(color, 1.0);
        }
    </script>

    <script>
        let renderer, material, scene, camera;
        const state = { density: 4.0, thickness: 0.0, mode: 0, shape: 0 };

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-wrapper').appendChild(renderer.domElement);

            material = new THREE.ShaderMaterial({
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent,
                uniforms: {
                    uTime: { value: 0 },
                    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    uDensity: { value: state.density },
                    uThickness: { value: state.thickness },
                    uMode: { value: state.mode },
                    uShape: { value: state.shape }
                }
            });

            scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));
            
            document.getElementById('toggle-panel').onclick = () => document.getElementById('controls-container').classList.toggle('expanded');
            document.getElementById('export-btn').onclick = exportSTL;

            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function updateUniform(key, val) { 
            material.uniforms[key].value = val; 
            state[key.substring(1).toLowerCase()] = val;
        }

        // --- STL Export Engine ---
        async function exportSTL() {
            const btn = document.getElementById('export-btn');
            const status = document.getElementById('export-status');
            btn.disabled = true; btn.innerText = "Processing...";
            status.innerText = "Analyzing Voxel Mesh...";

            await new Promise(r => setTimeout(r, 100));

            const hash33 = (x, y, z) => {
                let px = (Math.sin(x * 12.9898 + y * 78.233 + z * 45.164) * 43758.5453) % 1;
                let py = (Math.sin(x * 34.1234 + y * 56.789 + z * 12.345) * 43758.5453) % 1;
                let pz = (Math.sin(x * 90.1234 + y * 12.345 + z * 67.890) * 43758.5453) % 1;
                return {x: Math.abs(px), y: Math.abs(py), z: Math.abs(pz)};
            };

            const sdVoronoi = (px, py, pz) => {
                let ix = Math.floor(px), iy = Math.floor(py), iz = Math.floor(pz);
                let fx = px - ix, fy = py - iy, fz = pz - iz;
                let d1 = 8.0, d2 = 8.0;
                for(let z=-1; z<=1; z++)
                for(let y=-1; y<=1; y++)
                for(let x=-1; x<=1; x++) {
                    let o = hash33(ix + x, iy + y, iz + z);
                    let rx = x + o.x - fx, ry = y + o.y - fy, rz = z + o.z - fz;
                    let d = rx*rx + ry*ry + rz*rz;
                    if(d < d1) { d2 = d1; d1 = d; } else if(d < d2) { d2 = d; }
                }
                return Math.sqrt(d2) - Math.sqrt(d1);
            };

            const map = (x, y, z) => {
                let shapeDist = 0;
                if (state.shape == 0) shapeDist = Math.max(Math.abs(x)-1.2, Math.abs(y)-1.2, Math.abs(z)-1.2) - 0.15;
                else if (state.shape == 1) shapeDist = Math.sqrt(x*x+y*y+z*z) - 1.5;
                else if (state.shape == 2) shapeDist = (Math.abs(x)+Math.abs(y)+Math.abs(z)-2.2)*0.577;
                else if (state.shape == 3) shapeDist = Math.max(Math.sqrt(x*x+z*z)-1.2, Math.abs(y)-1.4);
                
                let val = 0;
                let qx = x * state.density, qy = y * state.density, qz = z * state.density;
                if (state.mode == 0) val = Math.sin(qx)*Math.cos(qy) + Math.sin(qy)*Math.cos(qz) + Math.sin(qz)*Math.cos(qx);
                else if (state.mode == 1) val = Math.cos(qx) + Math.cos(qy) + Math.cos(qz);
                else if (state.mode == 2) val = 3*(Math.cos(qx)+Math.cos(qy)+Math.cos(qz)) + 4*Math.cos(qx)*Math.cos(qy)*Math.cos(qz);
                else if (state.mode == 3) val = sdVoronoi(x * state.density * 0.5, y * state.density * 0.5, z * state.density * 0.5) * 4.0 - 1.0;
                
                return Math.max(shapeDist, Math.abs(val - state.thickness) - 0.22);
            };

            let stl = "solid manifold\n";
            const res = 42; const step = 3.4 / res;
            let count = 0;
            
            for(let i=0; i<res; i++) {
                for(let j=0; j<res; j++) {
                    for(let k=0; k<res; k++) {
                        let x = (i/res - 0.5) * 3.4, y = (j/res - 0.5) * 3.4, z = (k/res - 0.5) * 3.4;
                        if(map(x,y,z) < 0) {
                            count++;
                            const s = step * 0.505; // Slight overlap to avoid non-manifold edges
                            const p = [[x-s,y-s,z-s],[x+s,y-s,z-s],[x+s,y+s,z-s],[x-s,y+s,z-s],[x-s,y-s,z+s],[x+s,y-s,z+s],[x+s,y+s,z+s],[x-s,y+s,z+s]];
                            const faces = [[0,1,2],[0,2,3],[4,5,6],[4,6,7],[0,1,5],[0,5,4],[2,3,7],[2,7,6],[0,3,7],[0,7,4],[1,2,6],[1,6,5]];
                            faces.forEach(f => {
                                stl += `facet normal 0 0 0\n outer loop\n  vertex ${p[f[0]][0]} ${p[f[0]][1]} ${p[f[0]][2]}\n  vertex ${p[f[1]][0]} ${p[f[1]][1]} ${p[f[1]][2]}\n  vertex ${p[f[2]][0]} ${p[f[2]][1]} ${p[f[2]][2]}\n endloop\nendfacet\n`;
                            });
                        }
                    }
                }
            }
            stl += "endsolid manifold";
            
            const blob = new Blob([stl], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `voronoi_manifold_${Date.now()}.stl`;
            a.click();
            
            btn.disabled = false; btn.innerText = "Generate & Export STL";
            status.innerText = `Exported ${count} Voxels!`;
        }

        function animate(time) {
            requestAnimationFrame(animate);
            material.uniforms.uTime.value = time * 0.001;
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>

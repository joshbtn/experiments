<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manifold Engine v6.0 - STL Export</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #010205; font-family: 'Inter', sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .glass-panel { background: rgba(8, 12, 20, 0.85); backdrop-filter: blur(24px) saturate(200%); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8); }
        #controls-content { max-height: 0; opacity: 0; overflow: hidden; transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease; }
        #controls-container.expanded #controls-content { max-height: 1000px; opacity: 1; padding-bottom: 2rem; }
        .slider-input { -webkit-appearance: none; width: 100%; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 5px; outline: none; }
        .slider-input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #6366f1; border-radius: 50%; cursor: pointer; border: 2px solid #ffffff; }
    </style>
</head>
<body>

    <div id="canvas-wrapper"></div>

    <!-- UI Panel -->
    <div id="controls-container" class="fixed top-8 left-8 w-80 glass-panel rounded-[2rem] z-50 transition-all duration-500 overflow-hidden">
        <button id="toggle-panel" class="w-full px-7 py-6 flex items-center justify-between text-left group outline-none">
            <div class="flex items-center gap-3">
                <div class="w-2.5 h-2.5 rounded-full bg-indigo-500 shadow-[0_0_12px_rgba(99,102,241,1)]"></div>
                <span class="text-[10px] font-black tracking-[0.3em] uppercase text-indigo-100">Export Engine</span>
            </div>
            <svg id="chevron" class="w-4 h-4 text-slate-500 transition-transform duration-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
        </button>

        <div id="controls-content" class="px-7 space-y-7">
            <div class="space-y-3">
                <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Bounding Volume</label>
                <select id="shape-select" onchange="updateUniform('uShape', parseInt(this.value))" class="w-full bg-slate-900 border border-white/10 rounded-xl p-3 text-xs font-bold text-indigo-100 outline-none">
                    <option value="0">Rounded Cube</option>
                    <option value="1">Lattice Sphere</option>
                    <option value="2">Octahedron</option>
                    <option value="3">Cylinder</option>
                </select>
            </div>

            <div class="space-y-3">
                <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Algorithm</label>
                <select id="mode-select" onchange="updateUniform('uMode', parseInt(this.value))" class="w-full bg-slate-900 border border-white/10 rounded-xl p-3 text-xs font-bold text-indigo-100 outline-none">
                    <option value="0">Gyroid</option>
                    <option value="1">Schwarz P</option>
                    <option value="2">Neovius</option>
                </select>
            </div>

            <div class="space-y-6">
                <div class="space-y-2">
                    <div class="flex justify-between items-center text-[9px] font-bold text-slate-500 uppercase">
                        <span>Lattice Density</span>
                        <span id="val-density" class="text-indigo-400">4.0</span>
                    </div>
                    <input id="input-density" type="range" min="1" max="10" step="0.1" value="4.0" oninput="updateUniform('uDensity', parseFloat(this.value)); document.getElementById('val-density').innerText = parseFloat(this.value).toFixed(1);" class="slider-input">
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between items-center text-[9px] font-bold text-slate-500 uppercase">
                        <span>Wall Thickness</span>
                        <span id="val-thickness" class="text-indigo-400">0.00</span>
                    </div>
                    <input id="input-thickness" type="range" min="-1.5" max="1.5" step="0.05" value="0.0" oninput="updateUniform('uThickness', parseFloat(this.value)); document.getElementById('val-thickness').innerText = parseFloat(this.value).toFixed(2);" class="slider-input">
                </div>
            </div>

            <div class="pt-6 border-t border-white/5 space-y-4">
                <button id="export-btn" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-lg transition-all active:scale-95">
                    Export STL (3D Print)
                </button>
                <p id="export-status" class="text-[8px] text-slate-500 text-center font-mono uppercase tracking-widest">Ready for fabrication</p>
            </div>
        </div>
    </div>

    <!-- Shaders are the same as v5.1, focusing on interaction here -->
    <script id="vertexShader" type="x-shader/x-vertex">varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }</script>
    <script id="fragmentShader" type="x-shader/x-fragment">
        precision highp float;
        uniform float uTime; uniform vec2 uResolution; uniform float uDensity; uniform float uThickness; uniform int uMode; uniform int uShape;
        varying vec2 vUv;
        float sdBox(vec3 p, vec3 b, float r) { vec3 q = abs(p) - b; return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0) - r; }
        float sdSphere(vec3 p, float s) { return length(p) - s; }
        float sdCylinder(vec3 p, vec2 h) { vec2 d = abs(vec2(length(p.xz),p.y)) - h; return min(max(d.x,d.y),0.0) + length(max(d,0.0)); }
        float sdOctahedron(vec3 p, float s) { p = abs(p); return (p.x+p.y+p.z-s)*0.57735027; }
        float getManifold(vec3 p) {
            vec3 q = p * uDensity;
            if (uMode == 0) return sin(q.x)*cos(q.y) + sin(q.y)*cos(q.z) + sin(q.z)*cos(q.x);
            if (uMode == 1) return cos(q.x) + cos(q.y) + cos(q.z);
            return 3.0*(cos(q.x)+cos(q.y)+cos(q.z)) + 4.0*cos(q.x)*cos(q.y)*cos(q.z);
        }
        float map(vec3 p) {
            float shapeDist = 0.0;
            if (uShape == 0) shapeDist = sdBox(p, vec3(1.2), 0.15);
            else if (uShape == 1) shapeDist = sdSphere(p, 1.5);
            else if (uShape == 2) shapeDist = sdOctahedron(p, 2.2);
            else if (uShape == 3) shapeDist = sdCylinder(p, vec2(1.2, 1.4));
            float lattice = abs(getManifold(p) - uThickness) - 0.2;
            return max(shapeDist, lattice);
        }
        vec3 getNormal(vec3 p) { vec2 e = vec2(0.002, 0); return normalize(vec3(map(p+e.xyy)-map(p-e.xyy), map(p+e.yxy)-map(p-e.yxy), map(p+e.yyx)-map(p-e.yyx))); }
        void main() {
            vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / min(uResolution.y, uResolution.x);
            vec3 ro = vec3(0, 0, 5.0); vec3 rd = normalize(vec3(uv, -1.8));
            float t_y = uTime * 0.4; float t_x = sin(uTime * 0.2) * 0.2;
            mat3 rot = mat3(cos(t_y),0,sin(t_y), 0,1,0, -sin(t_y),0,cos(t_y)) * mat3(1,0,0, 0,cos(t_x),-sin(t_x), 0,sin(t_x),cos(t_x));
            ro = rot * ro; rd = rot * rd;
            float dist = 0.0; bool hit = false;
            for(int i=0; i<80; i++) { float d = map(ro + rd*dist); if(d < 0.001) { hit = true; break; } dist += d * 0.65; if(dist > 15.0) break; }
            vec3 color = vec3(0.01);
            if(hit) {
                vec3 p = ro + rd*dist; vec3 n = getNormal(p);
                float diff = max(dot(n, normalize(vec3(5,10,7))), 0.0);
                color = mix(vec3(0.05, 0.1, 0.25), vec3(0.7, 0.85, 1.0), n.y * 0.5 + 0.5) * diff + vec3(1.0) * pow(diff, 64.0);
            }
            gl_FragColor = vec4(color, 1.0);
        }
    </script>

    <script>
        let scene, camera, renderer, material;
        const state = { density: 4.0, thickness: 0.0, mode: 0, shape: 0 };

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-wrapper').appendChild(renderer.domElement);

            material = new THREE.ShaderMaterial({
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent,
                uniforms: {
                    uTime: { value: 0 },
                    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    uDensity: { value: state.density },
                    uThickness: { value: state.thickness },
                    uMode: { value: state.mode },
                    uShape: { value: state.shape }
                }
            });

            scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));
            
            document.getElementById('toggle-panel').onclick = () => document.getElementById('controls-container').classList.toggle('expanded');
            document.getElementById('export-btn').onclick = exportSTL;

            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function updateUniform(key, val) { 
            material.uniforms[key].value = val; 
            state[key.substring(1).toLowerCase()] = val;
        }

        async function exportSTL() {
            const btn = document.getElementById('export-btn');
            const status = document.getElementById('export-status');
            btn.disabled = true;
            btn.innerText = "Processing...";
            status.innerText = "Sampling 3D Field...";

            // Delay to allow UI update
            await new Promise(r => setTimeout(r, 100));

            // SDF math replicated in JS for export
            const sdBox = (p, b, r) => { let q = {x: Math.abs(p.x)-b.x, y: Math.abs(p.y)-b.y, z: Math.abs(p.z)-b.z}; return Math.sqrt(Math.max(q.x,0)**2 + Math.max(q.y,0)**2 + Math.max(q.z,0)**2) + Math.min(Math.max(q.x,Math.max(q.y,q.z)),0) - r; };
            const sdSphere = (p, s) => Math.sqrt(p.x**2 + p.y**2 + p.z**2) - s;
            const manifold = (p) => {
                let q = {x: p.x * state.density, y: p.y * state.density, z: p.z * state.density};
                if (state.mode == 0) return Math.sin(q.x)*Math.cos(q.y) + Math.sin(q.y)*Math.cos(q.z) + Math.sin(q.z)*Math.cos(q.x);
                if (state.mode == 1) return Math.cos(q.x) + Math.cos(q.y) + Math.cos(q.z);
                return 3*(Math.cos(q.x)+Math.cos(q.y)+Math.cos(q.z)) + 4*Math.cos(q.x)*Math.cos(q.y)*Math.cos(q.z);
            };

            const map = (x, y, z) => {
                let p = {x, y, z};
                let shapeDist = 0;
                if (state.shape == 0) shapeDist = sdBox(p, {x:1.2,y:1.2,z:1.2}, 0.15);
                else if (state.shape == 1) shapeDist = sdSphere(p, 1.5);
                else if (state.shape == 2) shapeDist = (Math.abs(x)+Math.abs(y)+Math.abs(z)-2.2)*0.577;
                else if (state.shape == 3) { let d = {x: Math.sqrt(x*x+z*z)-1.2, y: Math.abs(y)-1.4}; shapeDist = Math.min(Math.max(d.x,d.y),0) + Math.sqrt(Math.max(d.x,0)**2+Math.max(d.y,0)**2); }
                let lattice = Math.abs(manifold(p) - state.thickness) - 0.2;
                return Math.max(shapeDist, lattice);
            };

            // Simplified STL Export: generate a point cloud of small boxes for the manifold surface
            // This is more robust for a single-file demo than a full Marching Cubes table
            let stl = "solid manifold\n";
            const res = 40; 
            const step = 3.2 / res;
            
            for(let i=0; i<res; i++) {
                for(let j=0; j<res; j++) {
                    for(let k=0; k<res; k++) {
                        let x = (i/res - 0.5) * 3.2;
                        let y = (j/res - 0.5) * 3.2;
                        let z = (k/res - 0.5) * 3.2;
                        if(map(x,y,z) < 0) {
                            // Add a small cube to the STL for this voxel
                            const s = step * 0.5;
                            const pts = [
                                [x-s,y-s,z-s],[x+s,y-s,z-s],[x+s,y+s,z-s],[x-s,y+s,z-s],
                                [x-s,y-s,z+s],[x+s,y-s,z+s],[x+s,y+s,z+s],[x-s,y+s,z+s]
                            ];
                            const faces = [[0,1,2],[0,2,3],[4,5,6],[4,6,7],[0,1,5],[0,5,4],[2,3,7],[2,7,6],[0,3,7],[0,7,4],[1,2,6],[1,6,5]];
                            faces.forEach(f => {
                                stl += `facet normal 0 0 0\n outer loop\n`;
                                f.forEach(v => stl += `  vertex ${pts[v][0]} ${pts[v][1]} ${pts[v][2]}\n`);
                                stl += ` endloop\nendfacet\n`;
                            });
                        }
                    }
                }
            }
            stl += "endsolid manifold";

            // Trigger Download
            const blob = new Blob([stl], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `manifold_${Date.now()}.stl`;
            a.click();
            
            btn.disabled = false;
            btn.innerText = "Export STL (3D Print)";
            status.innerText = "Export Complete!";
        }

        function animate(time) {
            requestAnimationFrame(animate);
            material.uniforms.uTime.value = time * 0.001;
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabSynth FX - Pro Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Inter:wght@400;700;900&display=swap');
        
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Sequencer UI */
        .sequencer-container { display: flex; background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; overflow: hidden; }
        .string-labels { position: sticky; left: 0; z-index: 40; background: #1e293b; display: flex; flex-direction: column; gap: 4px; padding: 8px; border-right: 2px solid #334155; }
        .string-label { height: 44px; width: 36px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 800; color: #64748b; }
        .sequencer-scroll { overflow-x: auto; flex-grow: 1; padding: 8px; }
        .steps-wrapper { display: flex; gap: 4px; }
        .step-column { display: flex; flex-direction: column; gap: 4px; flex: 0 0 48px; position: relative; }
        .step-column.measure-start { border-left: 3px solid #475569; padding-left: 4px; margin-left: 2px; }
        .step-column.active { background: rgba(14, 165, 233, 0.15); }
        .step-column.active::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border: 2px solid #0ea5e9; pointer-events: none; z-index: 10; border-radius: 6px; }
        .cell { height: 44px; background: #1e293b; border: 1px solid #334155; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .cell input { width: 100%; height: 100%; background: transparent; border: none; color: #f1f5f9; text-align: center; font-weight: bold; font-family: 'JetBrains Mono', monospace; outline: none; }
        .cell.has-note { background: #075985; border-color: #0ea5e9; }

        /* Pedal Stack UI */
        #pedalBoard { display: flex; flex-direction: column; gap: 12px; max-width: 450px; margin: 0 auto; }
        .pedal { background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 16px; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .pedal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .pedal-type-tag { font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
        .flow-arrow { display: flex; justify-content: center; color: #334155; margin: -4px 0; font-size: 20px; }

        .tag-dist { background: #ef4444; color: #fff; }
        .tag-delay { background: #10b981; color: #fff; }
        .tag-chorus { background: #8b5cf6; color: #fff; }
        .tag-wah { background: #f59e0b; color: #fff; }
        .tag-reverb { background: #0ea5e9; color: #fff; }

        input[type=range] { -webkit-appearance: none; background: #334155; height: 4px; border-radius: 2px; width: 100%; margin: 8px 0; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #f8fafc; border-radius: 50%; cursor: pointer; }
        
        /* Error Toast */
        #statusToast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; padding: 16px 24px; border-radius: 12px; font-weight: bold;
            display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            opacity: 0; transition: all 0.3s; pointer-events: none;
            max-width: 90vw;
        }
        .toast-show { opacity: 1 !important; transform: translate(-50%, 10px) !important; pointer-events: auto !important; }
        .bg-err { background: #ef4444; color: #fff; border: 1px solid #7f1d1d; }
        .bg-ok { background: #10b981; color: #020617; }
    </style>
</head>
<body class="p-4 lg:p-8">

    <!-- Global Error Toast -->
    <div id="statusToast">
        <span id="toastMsg" class="truncate max-w-[200px] sm:max-w-md">Status Message</span>
        <button id="copyErrBtn" class="bg-black/30 px-3 py-1 rounded text-[10px] font-black uppercase border border-white/20 whitespace-nowrap hidden">Copy Trace</button>
        <button id="closeToast" class="ml-2 text-white/50 hover:text-white">✕</button>
    </div>

    <div class="max-w-7xl mx-auto">
        <!-- Modeling Dashboard -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-6 shadow-2xl">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-center">
                <div class="flex flex-wrap gap-6">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Guitar Type</label>
                        <select id="guitarType" class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm font-bold text-sky-400 outline-none w-48">
                            <option value="acoustic">Steel Acoustic</option>
                            <option value="electric">Electric Clean</option>
                            <option value="nylon">Nylon String</option>
                            <option value="banjo">Banjo</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Sustain: <span id="dampingVal" class="text-white">96</span>%</label>
                        <input type="range" id="damping" min="90" max="99" step="0.1" value="96" class="block w-32">
                    </div>
                </div>

                <div class="flex items-center justify-center gap-4 bg-slate-800 p-2 rounded-2xl border border-slate-700">
                    <button id="playBtn" class="w-12 h-12 bg-emerald-500 text-slate-950 rounded-xl flex items-center justify-center hover:bg-emerald-400 active:scale-95 transition-all">
                        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button id="pauseBtn" class="w-12 h-12 bg-amber-500 text-slate-950 rounded-xl hidden flex items-center justify-center hover:bg-amber-400">
                        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button id="stopBtn" class="w-12 h-12 bg-slate-700 text-white rounded-xl flex items-center justify-center hover:bg-slate-600">
                        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                    </button>
                </div>

                <div class="flex items-center justify-end gap-6">
                    <div class="flex flex-col gap-1">
                        <label class="text-[9px] font-black text-slate-500 uppercase">Tempo: <span id="tempoVal" class="text-white">120</span></label>
                        <input type="range" id="tempo" min="60" max="220" value="120" class="w-24">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[9px] font-black text-slate-500 uppercase text-right">Volume</label>
                        <input type="range" id="volume" min="0" max="100" value="70" class="w-24">
                    </div>
                </div>
            </div>
        </div>

        <!-- Sequencer Grid -->
        <div class="sequencer-container mb-6 shadow-lg">
            <div class="string-labels">
                <div class="string-label">e</div><div class="string-label">B</div><div class="string-label">G</div>
                <div class="string-label">D</div><div class="string-label">A</div><div class="string-label">E</div>
            </div>
            <div id="sequencerScroll" class="sequencer-scroll">
                <div id="stepsContainer" class="steps-wrapper"></div>
            </div>
        </div>

        <div class="flex gap-4 mb-12">
            <button id="addMeasureBtn" class="bg-slate-800 hover:bg-slate-700 px-6 py-2 rounded-xl border border-slate-700 text-[10px] font-black uppercase tracking-widest">+ Add Measure</button>
            <div class="ml-auto flex items-center gap-2">
                <span id="posIndicator" class="text-sky-400 font-mono text-sm mr-4">001</span>
                <button id="clearBtn" class="bg-slate-900 hover:bg-red-900/20 text-slate-600 hover:text-red-400 px-4 py-2 rounded-xl border border-slate-800 text-[10px] font-black uppercase">Clear Tab</button>
            </div>
        </div>

        <!-- Signal Path -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
            <div>
                <h2 class="text-xs font-black uppercase tracking-[0.3em] text-sky-500 mb-6 italic">Pedal Management</h2>
                <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
                    <p class="text-slate-400 text-xs mb-6 font-medium">Stack pedals below. Signal flow moves from Source down through your FX chain.</p>
                    <div class="flex gap-2">
                        <select id="pedalPicker" class="flex-grow bg-slate-800 text-xs border border-slate-700 rounded-xl px-4 py-3 font-bold text-white outline-none">
                            <option value="dist">Overdrive (Drive)</option>
                            <option value="delay">Analog Delay (Echo)</option>
                            <option value="chorus">Lush Chorus (Sweep)</option>
                            <option value="wah">Wah Filter (Bandpass)</option>
                            <option value="reverb">Room Reverb (Space)</option>
                        </select>
                        <button id="addPedalBtn" class="bg-sky-600 text-xs px-6 py-3 rounded-xl font-black uppercase text-white hover:bg-sky-500 active:scale-95 transition-all">Add Pedal</button>
                    </div>
                </div>
            </div>

            <div class="pb-20">
                <div class="flex items-center gap-4 mb-4">
                    <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                    <h2 class="text-[10px] font-black uppercase tracking-[0.3em] text-slate-500">Guitar Source</h2>
                </div>
                
                <div id="pedalBoard">
                    <!-- Pedals go here -->
                </div>

                <div class="flex items-center gap-4 mt-4">
                    <div class="w-3 h-3 rounded-full bg-sky-500"></div>
                    <h2 class="text-[10px] font-black uppercase tracking-[0.3em] text-slate-500">Master Output</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden element for clipboard -->
    <textarea id="hiddenClipboard" style="position:absolute;left:-9999px;top:0"></textarea>

    <script>
        // --- GLOBAL ERROR HANDLING & NOTIFICATIONS ---
        let lastErrorDetails = null;

        function showError(msg, err = null) {
            const toast = document.getElementById('statusToast');
            const toastMsg = document.getElementById('toastMsg');
            const copyBtn = document.getElementById('copyErrBtn');
            
            toast.className = 'toast-show ' + (err ? 'bg-err' : 'bg-ok');
            toastMsg.innerText = msg;
            
            if (err) {
                lastErrorDetails = `Message: ${err.message}\nStack: ${err.stack}`;
                copyBtn.classList.remove('hidden');
                console.error("TabSynth Error:", err);
            } else {
                lastErrorDetails = null;
                copyBtn.classList.add('hidden');
                setTimeout(() => toast.classList.remove('toast-show'), 2000);
            }
        }

        // Catch unhandled runtime errors
        window.onerror = function(message, source, lineno, colno, error) {
            showError("Runtime Error", error || { message, stack: `${source}:${lineno}` });
            return true;
        };

        // Catch unhandled promise rejections (async errors)
        window.onunhandledrejection = function(event) {
            showError("Async Error", event.reason);
        };

        document.getElementById('copyErrBtn').onclick = (e) => {
            e.stopPropagation();
            if (lastErrorDetails) {
                const area = document.getElementById('hiddenClipboard');
                area.value = lastErrorDetails;
                area.select();
                document.execCommand('copy');
                showError("Error details copied to clipboard!");
            }
        };

        document.getElementById('closeToast').onclick = () => {
            document.getElementById('statusToast').classList.remove('toast-show');
        };

        // --- EFFECT ARCHITECTURE ---
        class BaseEffect {
            constructor(ctx) {
                this.ctx = ctx;
                this.input = ctx.createGain();
                this.output = ctx.createGain();
                this.params = {};
            }
            setup() {} 
            update() {}
            disconnect() { this.input.disconnect(); this.output.disconnect(); }
        }

        class Overdrive extends BaseEffect {
            setup() {
                this.shaper = this.ctx.createWaveShaper();
                this.input.connect(this.shaper);
                this.shaper.connect(this.output);
                this.params = { drive: 50 };
                this.update();
            }
            update() {
                const k = this.params.drive;
                const n = 44100;
                const curve = new Float32Array(n);
                for (let i = 0 ; i < n; ++i ) {
                    const x = i * 2 / n - 1;
                    curve[i] = (3 + k) * x * 20 * (Math.PI / 180) / (Math.PI + k * Math.abs(x));
                }
                this.shaper.curve = curve;
            }
        }

        class Delay extends BaseEffect {
            setup() {
                this.delayNode = this.ctx.createDelay(2.0);
                this.fb = this.ctx.createGain();
                this.input.connect(this.output); 
                this.input.connect(this.delayNode);
                this.delayNode.connect(this.fb);
                this.fb.connect(this.delayNode);
                this.delayNode.connect(this.output);
                this.params = { time: 0.4, feedback: 0.4 };
                this.update();
            }
            update() {
                this.delayNode.delayTime.setTargetAtTime(this.params.time, this.ctx.currentTime, 0.05);
                this.fb.gain.setTargetAtTime(this.params.feedback, this.ctx.currentTime, 0.05);
            }
        }

        class Chorus extends BaseEffect {
            setup() {
                this.d = this.ctx.createDelay();
                this.lfo = this.ctx.createOscillator();
                this.depth = this.ctx.createGain();
                this.lfo.connect(this.depth);
                this.depth.connect(this.d.delayTime);
                this.input.connect(this.output);
                this.input.connect(this.d);
                this.d.connect(this.output);
                this.lfo.start();
                this.params = { rate: 1.5 };
                this.update();
            }
            update() { this.lfo.frequency.value = this.params.rate; this.depth.gain.value = 0.002; }
        }

        class Wah extends BaseEffect {
            setup() {
                this.f = this.ctx.createBiquadFilter();
                this.f.type = 'bandpass';
                this.f.Q.value = 8;
                this.input.connect(this.f);
                this.f.connect(this.output);
                this.params = { freq: 1000 };
                this.update();
            }
            update() { this.f.frequency.setTargetAtTime(this.params.freq, this.ctx.currentTime, 0.05); }
        }

        class Reverb extends BaseEffect {
            setup() {
                this.wet = this.ctx.createGain();
                this.input.connect(this.output);
                [0.03, 0.05, 0.07].forEach(t => {
                    const d = this.ctx.createDelay(); d.delayTime.value = t;
                    const f = this.ctx.createGain(); f.gain.value = 0.4;
                    this.input.connect(d); d.connect(f); f.connect(d); d.connect(this.wet);
                });
                this.wet.connect(this.output);
                this.params = { mix: 50 };
                this.update();
            }
            update() { this.wet.gain.value = this.params.mix / 100; }
        }

        // --- AUDIO CORE ---
        class AudioCore {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.master = this.ctx.createGain();
                this.master.connect(this.ctx.destination);
                this.guitar = this.ctx.createGain();
                this.pedals = [];
                this.rebuild();
            }
            async resume() { if (this.ctx.state === 'suspended') await this.ctx.resume(); }
            
            rebuild() {
                try {
                    this.guitar.disconnect();
                    this.pedals.forEach(p => p.instance.output.disconnect());

                    let currentSource = this.guitar;

                    if (this.pedals.length === 0) {
                        currentSource.connect(this.master);
                    } else {
                        this.pedals.forEach(p => {
                            currentSource.connect(p.instance.input);
                            currentSource = p.instance.output;
                        });
                        currentSource.connect(this.master);
                    }
                } catch (err) {
                    showError("Pipeline Error", err);
                }
            }

            trigger(freq, d, type, time = 0) {
                const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 2, this.ctx.sampleRate);
                const data = buf.getChannelData(0);
                const p = Math.round(this.ctx.sampleRate / freq);
                for (let i = 0; i < p; i++) data[i] = Math.random() * 2 - 1;
                let damp = d;
                if(type === 'banjo') damp *= 0.85;
                if(type === 'nylon') damp = Math.min(0.992, damp * 1.01);
                for (let i = p; i < data.length; i++) data[i] = (data[i - p] + data[i - p + 1]) * 0.5 * damp;
                const src = this.ctx.createBufferSource();
                src.buffer = buf;
                src.connect(this.guitar);
                src.start(time);
            }
        }

        const core = new AudioCore();
        let playing = false, totalSteps = 0, currentStep = 0, nextTime = 0;
        const FREQS = { 'e': 329.63, 'B': 246.94, 'G': 196.00, 'D': 146.83, 'A': 110.00, 'E': 82.41 };
        const STRINGS = ['e', 'B', 'G', 'D', 'A', 'E'];

        function refreshBoardUI() {
            try {
                const board = document.getElementById('pedalBoard');
                board.innerHTML = '';
                
                core.pedals.forEach((p, index) => {
                    const pedalDiv = document.createElement('div');
                    pedalDiv.className = 'pedal';
                    pedalDiv.id = p.id;
                    pedalDiv.innerHTML = `
                        <div class="pedal-header">
                            <span class="pedal-type-tag tag-${p.type}">${p.type}</span>
                            <button onclick="window.removePedal('${p.id}')" class="text-slate-500 hover:text-red-400 font-bold">✕</button>
                        </div>
                        <div id="controls-${p.id}" class="space-y-4"></div>
                        <div class="flex justify-between mt-4">
                             <button onclick="window.movePedal('${p.id}', -1)" class="text-[9px] font-black uppercase text-slate-500 hover:text-white">↑ Lift</button>
                             <button onclick="window.movePedal('${p.id}', 1)" class="text-[9px] font-black uppercase text-slate-500 hover:text-white">Drop ↓</button>
                        </div>
                    `;

                    // Using specific ID selector for safe access
                    const controls = pedalDiv.querySelector(`[id="controls-${p.id}"]`);
                    Object.keys(p.instance.params).forEach(key => {
                        const group = document.createElement('div');
                        group.innerHTML = `<label class="text-[8px] uppercase font-black text-slate-600 tracking-tighter">${key}</label>`;
                        const slider = document.createElement('input');
                        slider.type = 'range';
                        slider.min = key === 'drive' ? 0 : 0.05;
                        slider.max = key === 'drive' ? 200 : 1.0;
                        slider.step = 0.01;
                        slider.value = p.instance.params[key];
                        slider.oninput = (e) => {
                            p.instance.params[key] = parseFloat(e.target.value);
                            p.instance.update();
                        };
                        group.appendChild(slider);
                        controls.appendChild(group);
                    });

                    board.appendChild(pedalDiv);
                    if (index < core.pedals.length - 1) {
                        const arrow = document.createElement('div');
                        arrow.className = 'flow-arrow'; arrow.innerHTML = '⋮';
                        board.appendChild(arrow);
                    }
                });
            } catch (err) {
                showError("UI Error", err);
            }
        }

        async function addPedal() {
            try {
                await core.resume();
                const type = document.getElementById('pedalPicker').value;
                let inst;
                if(type === 'dist') inst = new Overdrive(core.ctx);
                else if(type === 'delay') inst = new Delay(core.ctx);
                else if(type === 'chorus') inst = new Chorus(core.ctx);
                else if(type === 'wah') inst = new Wah(core.ctx);
                else if(type === 'reverb') inst = new Reverb(core.ctx);

                if (!inst) throw new Error("Invalid pedal selection");

                inst.setup(); 
                const safeId = 'p' + Date.now() + Math.floor(Math.random() * 1000);
                core.pedals.push({ id: safeId, type, instance: inst });
                core.rebuild();
                refreshBoardUI();
                showError(`Pedal Added.`);
            } catch (err) {
                showError("Add Pedal Error", err);
            }
        }

        window.removePedal = (id) => {
            const p = core.pedals.find(x => x.id === id);
            if(p) p.instance.disconnect();
            core.pedals = core.pedals.filter(p => p.id !== id);
            core.rebuild();
            refreshBoardUI();
        };

        window.movePedal = (id, dir) => {
            const i = core.pedals.findIndex(p => p.id === id);
            const ni = i + dir;
            if (ni >= 0 && ni < core.pedals.length) {
                const [moved] = core.pedals.splice(i, 1);
                core.pedals.splice(ni, 0, moved);
                core.rebuild();
                refreshBoardUI();
            }
        };

        // --- SEQUENCER ---
        function createStep(idx) {
            const col = document.createElement('div');
            col.className = 'step-column' + (idx % 16 === 0 ? ' measure-start' : '');
            STRINGS.forEach(s => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                const input = document.createElement('input');
                input.type = 'text'; input.placeholder = '-';
                input.oninput = (e) => {
                    core.resume();
                    const v = e.target.value.replace(/\D/g, '');
                    e.target.value = v;
                    v ? cell.classList.add('has-note') : cell.classList.remove('has-note');
                    if (v && !playing) core.trigger(FREQS[s] * Math.pow(2, parseInt(v)/12), document.getElementById('damping').value/100, document.getElementById('guitarType').value);
                };
                cell.appendChild(input);
                col.appendChild(cell);
            });
            return col;
        }

        function addMeasure() {
            const f = document.createDocumentFragment();
            for (let i = 0; i < 16; i++) f.appendChild(createStep(totalSteps + i));
            document.getElementById('stepsContainer').appendChild(f);
            totalSteps += 16;
        }

        function scheduler() {
            while (nextTime < core.ctx.currentTime + 0.1) {
                const col = document.getElementById('stepsContainer').children[currentStep];
                if (col) {
                    const d = document.getElementById('damping').value/100, t = document.getElementById('guitarType').value;
                    col.querySelectorAll('input').forEach((inp, i) => { if (inp.value) core.trigger(FREQS[STRINGS[i]] * Math.pow(2, parseInt(inp.value)/12), d, t, nextTime); });
                    const step = currentStep;
                    requestAnimationFrame(() => {
                        document.querySelectorAll('.step-column').forEach(c => c.classList.remove('active'));
                        col.classList.add('active');
                        document.getElementById('posIndicator').innerText = String(step + 1).padStart(3, '0');
                    });
                }
                nextTime += (60.0 / document.getElementById('tempo').value) * 0.25;
                currentStep = (currentStep + 1) % totalSteps;
            }
            if (playing) setTimeout(scheduler, 25);
        }

        window.onload = () => {
            addMeasure(); addMeasure();
            document.getElementById('addPedalBtn').onclick = addPedal;
            document.getElementById('playBtn').onclick = async () => { await core.resume(); if (playing) return; playing = true; nextTime = core.ctx.currentTime; document.getElementById('playBtn').classList.add('hidden'); document.getElementById('pauseBtn').classList.remove('hidden'); scheduler(); };
            document.getElementById('pauseBtn').onclick = () => { playing = false; document.getElementById('pauseBtn').classList.add('hidden'); document.getElementById('playBtn').classList.remove('hidden'); };
            document.getElementById('stopBtn').onclick = () => { playing = false; currentStep = 0; document.getElementById('posIndicator').innerText = "001"; document.getElementById('pauseBtn').classList.add('hidden'); document.getElementById('playBtn').classList.remove('hidden'); document.querySelectorAll('.step-column').forEach(c => c.classList.remove('active')); };
            document.getElementById('addMeasureBtn').onclick = addMeasure;
            document.getElementById('damping').oninput = (e) => document.getElementById('dampingVal').innerText = e.target.value;
            document.getElementById('tempo').oninput = (e) => document.getElementById('tempoVal').innerText = e.target.value;
            document.getElementById('volume').oninput = (e) => core.master.gain.setTargetAtTime(e.target.value/100, core.ctx.currentTime, 0.05);
            document.getElementById('clearBtn').onclick = () => { if(confirm("Clear tab?")) document.querySelectorAll('input[type=text]').forEach(i => { i.value = ''; i.parentElement.classList.remove('has-note'); }); };
        };
    </script>
</body>
</html>

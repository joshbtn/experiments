<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile AI Canvas</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom scrollbar hiding for the quick styles list */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        body {
            background-color: #020617; /* slate-950 */
            color: #f1f5f9; /* slate-100 */
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- Icon Components (Lucide replicas) ---
        const Icon = ({ path, size = 24, className = "", fill = "none" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill={fill} 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {path}
            </svg>
        );

        const Icons = {
            Zap: (props) => <Icon path={<><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></>} {...props} />,
            Shield: (props) => <Icon path={<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></>} {...props} />,
            Settings: (props) => <Icon path={<><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></>} {...props} />,
            Cpu: (props) => <Icon path={<><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></>} {...props} />,
            Terminal: (props) => <Icon path={<><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></>} {...props} />,
            Activity: (props) => <Icon path={<><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></>} {...props} />,
            Maximize2: (props) => <Icon path={<><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></>} {...props} />,
            RefreshCw: (props) => <Icon path={<><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></>} {...props} />,
            ImageIcon: (props) => <Icon path={<><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></>} {...props} />,
            Share2: (props) => <Icon path={<><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></>} {...props} />,
            Download: (props) => <Icon path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></>} {...props} />,
        };

        const STEPS = 4;
        const RESOLUTION = 512;

        // --- NoiseCanvas Component ---
        const NoiseCanvas = ({ isGenerating, step, finalImageUrl }) => {
            const canvasRef = useRef(null);

            const drawNoise = useCallback((ctx, width, height, intensity) => {
                const imageData = ctx.createImageData(width, height);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const val = Math.random() * 255;
                    data[i] = val;
                    data[i + 1] = val;
                    data[i + 2] = val;
                    data[i + 3] = 255 * intensity;
                }
                ctx.putImageData(imageData, 0, 0);
            }, []);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (finalImageUrl && !isGenerating) {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.src = finalImageUrl;
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    };
                } else if (isGenerating) {
                    const noiseLevel = 1 - (step / (STEPS + 1));
                    ctx.fillStyle = '#2a2a35';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    drawNoise(ctx, canvas.width, canvas.height, noiseLevel);
                    ctx.fillStyle = `rgba(0, 255, 200, ${0.1 * step})`;
                    ctx.fillRect(0, 0, canvas.width, canvas.height * (step / STEPS));
                } else {
                    ctx.fillStyle = '#111116';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.strokeStyle = '#222';
                    ctx.lineWidth = 1;
                    const gridSize = 32;
                    for(let x=0; x<canvas.width; x+=gridSize) {
                        ctx.beginPath();
                        ctx.moveTo(x,0);
                        ctx.lineTo(x, canvas.height);
                        ctx.stroke();
                    }
                    for(let y=0; y<canvas.height; y+=gridSize) {
                        ctx.beginPath();
                        ctx.moveTo(0, y);
                        ctx.lineTo(canvas.width, y);
                        ctx.stroke();
                    }
                }
            }, [isGenerating, step, finalImageUrl, drawNoise]);

            return (
                <canvas 
                    ref={canvasRef} 
                    width={RESOLUTION} 
                    height={RESOLUTION} 
                    className="w-full h-auto aspect-square rounded-xl border border-white/10 shadow-2xl shadow-cyan-900/10"
                />
            );
        };

        // --- Main App Component ---
        function App() {
            const [prompt, setPrompt] = useState('Cyberpunk street vendor in heavy rain, neon lights, 8k, photorealistic');
            const [isGenerating, setIsGenerating] = useState(false);
            const [step, setStep] = useState(0);
            const [status, setStatus] = useState('Ready');
            const [finalImage, setFinalImage] = useState(null);
            const [hardware, setHardware] = useState({
                adapterName: 'Checking GPU...',
                backend: 'WebGPU',
                isWebGPUSupported: false
            });
            const [showStats, setShowStats] = useState(true);

            // Hardware Detection
            useEffect(() => {
                const checkGPU = async () => {
                    if ('gpu' in navigator) {
                        try {
                            const adapter = await navigator.gpu.requestAdapter();
                            const info = await adapter?.requestAdapterInfo();
                            setHardware({
                                adapterName: info?.device || 'Generic WebGPU Adapter',
                                backend: 'WebGPU (Metal/Vulkan)',
                                isWebGPUSupported: true
                            });
                        } catch (e) {
                            setHardware({
                                adapterName: 'GPU Access Failed',
                                backend: 'Fallback',
                                isWebGPUSupported: false
                            });
                        }
                    } else {
                        setHardware({
                            adapterName: 'WebGPU Not Available',
                            backend: 'WASM Fallback',
                            isWebGPUSupported: false
                        });
                    }
                };
                checkGPU();
            }, []);

            const handleGenerate = async () => {
                if (!prompt.trim()) return;
                
                setIsGenerating(true);
                setFinalImage(null);
                setStep(0);

                const operations = [
                    { msg: 'Loading Quantized Model (Q4_0)...', time: 800 },
                    { msg: 'Allocating Tensor Buffers...', time: 600 },
                    { msg: 'Encoding Text Embeddings...', time: 600 },
                    { msg: 'Initializing Latent Noise...', time: 400 },
                ];

                for (const op of operations) {
                    setStatus(op.msg);
                    await new Promise(r => setTimeout(r, op.time));
                }

                for (let i = 1; i <= STEPS; i++) {
                    setStatus(`Denoising Latents (Step ${i}/${STEPS})...`);
                    setStep(i);
                    await new Promise(r => setTimeout(r, 800)); 
                }

                setStatus('Decoding VAE...');
                await new Promise(r => setTimeout(r, 500));

                const randomSeed = Math.floor(Math.random() * 1000);
                const mockResultUrl = `https://picsum.photos/seed/${randomSeed}/512/512`; 
                
                const img = new Image();
                img.src = mockResultUrl;
                img.onload = () => {
                    setFinalImage(mockResultUrl);
                    setIsGenerating(false);
                    setStatus(`Done (${(Math.random() * 2 + 1).toFixed(2)}s)`);
                };
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 font-sans selection:bg-cyan-500/30">
                    {/* Top Bar */}
                    <header className="fixed top-0 w-full z-50 bg-slate-950/80 backdrop-blur-md border-b border-white/5">
                        <div className="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-cyan-500/20">
                                    <Icons.Zap size={18} className="text-white fill-white" />
                                </div>
                                <h1 className="font-bold text-lg tracking-tight">AI Canvas <span className="text-xs font-normal text-cyan-400 border border-cyan-400/30 px-1 rounded">MOBILE</span></h1>
                            </div>
                            <div className="flex gap-3">
                                <div className="flex items-center gap-1 text-xs text-green-400 bg-green-900/20 px-2 py-1 rounded-full border border-green-900/30">
                                    <Icons.Shield size={10} />
                                    <span>Private</span>
                                </div>
                                <button className="p-2 hover:bg-white/5 rounded-full transition-colors">
                                    <Icons.Settings size={20} className="text-slate-400" />
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="pt-20 pb-40 max-w-md mx-auto px-4 space-y-6">
                        
                        {/* Hardware Status Card */}
                        <div className={`transition-all duration-500 overflow-hidden ${showStats ? 'max-h-32 opacity-100' : 'max-h-0 opacity-0'}`}>
                            <div className="bg-slate-900/50 border border-white/5 rounded-xl p-3 flex items-center justify-between text-xs">
                                <div className="space-y-1">
                                    <div className="flex items-center gap-2 text-slate-400">
                                        <Icons.Cpu size={14} />
                                        <span>Hardware Accelerator</span>
                                    </div>
                                    <div className="font-mono text-cyan-400">{hardware.adapterName}</div>
                                </div>
                                <div className="text-right space-y-1">
                                    <div className="text-slate-500">Backend</div>
                                    <div className={`font-medium ${hardware.isWebGPUSupported ? 'text-green-400' : 'text-orange-400'}`}>
                                        {hardware.backend}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Canvas Area */}
                        <div className="relative group">
                            <NoiseCanvas 
                                isGenerating={isGenerating} 
                                step={step} 
                                finalImageUrl={finalImage} 
                            />
                            
                            {/* Status Overlay */}
                            {(isGenerating || finalImage) && (
                                <div className="absolute top-4 left-4 right-4 flex justify-between items-start">
                                    <div className="bg-black/60 backdrop-blur-md px-3 py-1 rounded-full text-xs font-mono border border-white/10 flex items-center gap-2">
                                        {isGenerating ? <Icons.Activity size={12} className="animate-spin text-cyan-400"/> : <Icons.Terminal size={12} className="text-green-400"/>}
                                        {status}
                                    </div>
                                    {finalImage && (
                                        <button className="bg-black/60 backdrop-blur-md p-2 rounded-full border border-white/10 hover:bg-white/20 transition">
                                            <Icons.Maximize2 size={16} />
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>

                        {/* Prompt Input Area */}
                        <div className="space-y-4">
                            <div className="bg-slate-900 border border-white/10 rounded-2xl p-1 shadow-2xl">
                                <textarea 
                                    value={prompt}
                                    onChange={(e) => setPrompt(e.target.value)}
                                    placeholder="Describe your image..."
                                    disabled={isGenerating}
                                    className="w-full bg-transparent text-sm p-3 min-h-[80px] outline-none resize-none text-slate-200 placeholder:text-slate-600 rounded-xl focus:bg-white/5 transition-colors"
                                />
                                <div className="flex items-center justify-between px-2 pb-1">
                                    {/* Quick Styles */}
                                    <div className="flex gap-2 overflow-x-auto py-2 px-1 max-w-[200px] no-scrollbar">
                                        {['Cinematic', 'Anime', '3D', 'Oil', 'B&W'].map(style => (
                                            <button key={style} className="text-[10px] bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded-md border border-white/5 whitespace-nowrap transition-colors">
                                                {style}
                                            </button>
                                        ))}
                                    </div>

                                    <button 
                                        onClick={handleGenerate}
                                        disabled={isGenerating || !hardware.isWebGPUSupported}
                                        className={`
                                            flex items-center gap-2 px-6 py-2 rounded-xl font-medium text-sm transition-all duration-200
                                            ${isGenerating 
                                            ? 'bg-slate-800 text-slate-500 cursor-not-allowed' 
                                            : 'bg-cyan-500 hover:bg-cyan-400 text-slate-950 shadow-[0_0_20px_-5px_rgba(6,182,212,0.6)]'
                                            }
                                        `}
                                    >
                                        {isGenerating ? 'Computing...' : 'Generate'}
                                        {!isGenerating && <Icons.Zap size={16} className="fill-slate-950" />}
                                    </button>
                                </div>
                            </div>

                            {/* Model Info */}
                            <div className="flex items-center justify-center gap-4 text-[10px] text-slate-500 font-mono uppercase tracking-widest">
                                <span>SD-Turbo</span>
                                <span className="w-1 h-1 bg-slate-600 rounded-full"></span>
                                <span>Q4_0 Quantized</span>
                                <span className="w-1 h-1 bg-slate-600 rounded-full"></span>
                                <span>512x512</span>
                            </div>
                        </div>

                    </main>

                    {/* Action Bar */}
                    <div className={`fixed bottom-0 w-full bg-slate-950 border-t border-white/10 p-4 transition-transform duration-300 ${finalImage ? 'translate-y-0' : 'translate-y-full'}`}>
                        <div className="max-w-md mx-auto grid grid-cols-4 gap-4">
                            <button className="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition-colors">
                                <div className="p-2 rounded-full bg-slate-900"><Icons.RefreshCw size={20} /></div>
                                <span className="text-[10px]">Refine</span>
                            </button>
                            <button className="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition-colors">
                                <div className="p-2 rounded-full bg-slate-900"><Icons.ImageIcon size={20} /></div>
                                <span className="text-[10px]">Variations</span>
                            </button>
                            <button className="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition-colors">
                                <div className="p-2 rounded-full bg-slate-900"><Icons.Share2 size={20} /></div>
                                <span className="text-[10px]">Share</span>
                            </button>
                            <button className="flex flex-col items-center gap-1 text-cyan-400 hover:text-cyan-300 transition-colors">
                                <div className="p-2 rounded-full bg-cyan-950/50 border border-cyan-900"><Icons.Download size={20} /></div>
                                <span className="text-[10px]">Save</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

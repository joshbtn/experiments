<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumina Link - Solvable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600&display=swap');
        :root { --neon-blue: #00f2ff; --neon-purple: #bc13fe; --bg-dark: #0a0a12; --tile-bg: #161625; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Rajdhani', sans-serif; overflow: hidden; touch-action: manipulation; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .game-container { max-width: 500px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1rem; }
        .grid-board { display: grid; gap: 4px; background: rgba(255, 255, 255, 0.05); padding: 8px; border-radius: 12px; border: 1px solid rgba(188, 19, 254, 0.3); }
        .tile { aspect-ratio: 1/1; background: var(--tile-bg); border-radius: 6px; cursor: pointer; transition: transform 0.2s; position: relative; display: flex; align-items: center; justify-content: center; }
        .tile.connected-to-source svg { filter: drop-shadow(0 0 5px var(--neon-blue)); stroke: var(--neon-blue); }
        .path-svg { width: 100%; height: 100%; fill: none; stroke: #333; stroke-width: 8; stroke-linecap: round; transition: stroke 0.4s; }
        .btn-neon { background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 0.5rem 1.5rem; border-radius: 4px; text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; }
        .btn-neon:hover { background: var(--neon-blue); color: var(--bg-dark); box-shadow: 0 0 15px var(--neon-blue); }
        .level-complete-overlay { position: absolute; inset: 0; background: rgba(10, 10, 18, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.5s; }
        .level-complete-overlay.active { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="w-full flex justify-between items-end mb-6">
            <h1 class="text-3xl font-orbitron font-bold text-white">LUMINA<span style="color: var(--neon-blue)">LINK</span></h1>
            <div class="text-right"><div class="text-xs text-gray-400 uppercase">Level</div><div id="level-display" class="text-2xl font-orbitron text-purple-400">01</div></div>
        </div>
        <div id="game-board" class="grid-board"></div>
        <div class="mt-8 flex gap-4">
            <button id="reset-btn" class="btn-neon">Reset</button>
            <button id="new-game-btn" class="btn-neon" style="border-color: var(--neon-purple); color: var(--neon-purple);">New Board</button>
        </div>
    </div>

    <div id="win-overlay" class="level-complete-overlay">
        <h2 class="text-5xl font-orbitron font-bold text-cyan-400 mb-2">LINKED</h2>
        <button id="next-level-btn" class="btn-neon text-lg px-12 py-3">Next Level</button>
    </div>

    <script>
        const TILE_DEFS = { 'line': [0, 2], 'corner': [1, 2], 't-shape': [1, 2, 3], 'cross': [0, 1, 2, 3], 'source': [1], 'target': [3] };
        let state = { size: 5, grid: [], currentLevel: 0, isWin: false };

        function initGame(lvl) {
            state.size = 4 + lvl;
            state.isWin = false;
            document.getElementById('win-overlay').classList.remove('active');
            document.getElementById('level-display').textContent = (lvl + 1).toString().padStart(2, '0');
            generateSolvableLevel();
            render();
            updateFlow();
        }

        function generateSolvableLevel() {
            const size = state.size;
            state.grid = Array.from({ length: size }, () => Array.from({ length: size }, () => ({ type: 'none', rotation: 0, ports: [] })));
            
            // 1. Create a Guaranteed Path (Random Walk)
            let curr = { r: Math.floor(Math.random() * size), c: 0 };
            let target = { r: Math.floor(Math.random() * size), c: size - 1 };
            let path = [ { ...curr } ];
            
            while (curr.c < size - 1) {
                let move = Math.random();
                if (move < 0.6) curr.c++; // Forward
                else if (move < 0.8 && curr.r > 0) curr.r--; // Up
                else if (curr.r < size - 1) curr.r++; // Down
                
                if (!path.some(p => p.r === curr.r && p.c === curr.c)) {
                    path.push({ ...curr });
                }
            }
            
            // 2. Assign shapes based on path entry/exit
            for (let i = 0; i < path.length; i++) {
                const node = path[i];
                let ports = [];
                if (i > 0) { // Entry from prev
                    const prev = path[i-1];
                    if (prev.r < node.r) ports.push(0); // Top
                    if (prev.r > node.r) ports.push(2); // Bottom
                    if (prev.c < node.c) ports.push(3); // Left
                } else ports.push(3); // Source entrance (dummy)

                if (i < path.length - 1) { // Exit to next
                    const next = path[i+1];
                    if (next.r < node.r) ports.push(0);
                    if (next.r > node.r) ports.push(2);
                    if (next.c > node.c) ports.push(1);
                } else ports.push(1); // Target exit (dummy)

                // Match ports to type
                const sorted = ports.sort().join('');
                let type = 'line';
                if (ports.length === 2) {
                    type = (ports[0] % 2 === ports[1] % 2) ? 'line' : 'corner';
                }
                state.grid[node.r][node.c] = { type, rotation: 0, ports, isPath: true };
            }

            // 3. Fill decoys & Shuffle
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (state.grid[r][c].type === 'none') {
                        const types = ['line', 'corner', 't-shape'];
                        state.grid[r][c].type = types[Math.floor(Math.random() * types.length)];
                    }
                    if (r === path[0].r && c === 0) state.grid[r][c].type = 'source';
                    if (r === path[path.length-1].r && c === size - 1) state.grid[r][c].type = 'target';
                    
                    state.grid[r][c].rotation = Math.floor(Math.random() * 4);
                }
            }
        }

        function getPorts(tile) {
            return TILE_DEFS[tile.type].map(p => (p + tile.rotation) % 4);
        }

        function updateFlow() {
            state.grid.forEach(row => row.forEach(t => t.connected = false));
            const source = state.grid.find(row => row[0].type === 'source')[0];
            const queue = [];
            
            for(let r=0; r<state.size; r++) {
                if(state.grid[r][0].type === 'source') {
                    state.grid[r][0].connected = true;
                    queue.push({r, c: 0});
                }
            }

            let head = 0;
            while(head < queue.length) {
                const {r, c} = queue[head++];
                const p1 = getPorts(state.grid[r][c]);
                [[r-1, c, 0, 2], [r, c+1, 1, 3], [r+1, c, 2, 0], [r, c-1, 3, 1]].forEach(([nr, nc, d, opp]) => {
                    if(nr>=0 && nr<state.size && nc>=0 && nc<state.size) {
                        const neighbor = state.grid[nr][nc];
                        if(!neighbor.connected && p1.includes(d) && getPorts(neighbor).includes(opp)) {
                            neighbor.connected = true;
                            queue.push({r: nr, c: nc});
                        }
                    }
                });
            }

            render();
            if (state.grid.some(row => row[state.size-1].type === 'target' && row[state.size-1].connected)) {
                state.isWin = true;
                setTimeout(() => document.getElementById('win-overlay').classList.add('active'), 500);
            }
        }

        function render() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            board.style.gridTemplateColumns = `repeat(${state.size}, 1fr)`;
            board.style.width = `${Math.min(window.innerWidth - 40, 450)}px`;

            state.grid.forEach((row, r) => row.forEach((tile, c) => {
                const el = document.createElement('div');
                el.className = `tile ${tile.connected ? 'connected-to-source' : ''}`;
                el.innerHTML = `<svg viewBox="0 0 100 100" class="path-svg" style="transform:rotate(${tile.rotation*90}deg)">
                    <path d="${tile.type==='line'?'M50 0V100':tile.type==='corner'?'M100 50Q50 50 50 100':tile.type==='t-shape'?'M0 50H100M50 50V100':tile.type==='cross'?'M0 50H100M50 0V100':tile.type==='source'?'M50 50H100M50 50m-10 0a10 10 0 10 20 0a10 10 0 10-20 0':'M0 50H50M40 40h20v20H40z'}"/>
                </svg>`;
                el.onclick = () => { if(!state.isWin) { tile.rotation = (tile.rotation + 1) % 4; updateFlow(); }};
                board.appendChild(el);
            }));
        }

        document.getElementById('new-game-btn').onclick = () => initGame(state.currentLevel);
        document.getElementById('reset-btn').onclick = () => initGame(state.currentLevel);
        document.getElementById('next-level-btn').onclick = () => { state.currentLevel++; initGame(state.currentLevel); };
        initGame(0);
    </script>
</body>
</html>

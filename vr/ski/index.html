<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SkiFree VR - Downhill Jumps</title>
    <script src="../../vendor/aframe.min.js"></script>
    <style>
      #ui {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Courier New', Courier, monospace;
        color: #000;
        background: rgba(255, 255, 255, 0.9);
        padding: 15px;
        border: 3px solid #ff2222;
        text-align: center;
        z-index: 10;
        pointer-events: none;
        border-radius: 8px;
      }
      .score { font-size: 24px; font-weight: bold; }
      #desktop-start-button {
        position: absolute;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        padding: 20px 40px;
        font-size: 24px;
        font-weight: bold;
        background-color: #ff2222;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        z-index: 10;
        display: none;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        transition: all 0.2s;
      }
      #desktop-start-button:hover {
        background-color: #ff4444;
        transform: translateX(-50%) scale(1.05);
      }
      #desktop-start-button:active {
        transform: translateX(-50%) scale(0.98);
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <div id="distance" class="score">Distance: 0m</div>
      <div id="msg">GAZE AT THE RED BOX TO START or CLICK START BUTTON</div>
    </div>
    <button id="desktop-start-button">🎿 CLICK TO START 🎿</button>

    <!-- Added raycaster configuration to the scene -->
    <a-scene 
      renderer="antialias: true; colorManagement: true;"
      fog="type: linear; color: #E0F6FF; near: 20; far: 120"
      background="color: #E0F6FF"
      raycaster="objects: .interactive">
      
      <a-assets>
        <a-mixin id="rainbow-strip" geometry="primitive: box; width: 3; height: 0.1; depth: 0.5"></a-mixin>
      </a-assets>

      <!-- Sky Sphere -->
      <a-sky id="sky" color="#E0F6FF"></a-sky>

      <!-- Player Rig -->
      <a-entity id="rig" position="0 0 0" rotation="-15 0 0">
        <a-entity id="player-container">
          <a-camera id="camera" look-controls wasd-controls="enabled: false">
            <!-- Fixed Cursor with proper fuse settings -->
            <a-entity id="cursor"
                      cursor="fuse: true; fuseTimeout: 2000"
                      raycaster="objects: .interactive"
                      position="0 0 -1"
                      geometry="primitive: ring; radiusOuter: 0.03; radiusInner: 0.02"
                      material="color: black; shader: flat"
                      animation__fusing="property: scale; startEvents: fusing; dur: 2000; from: 1 1 1; to: 0.1 0.1 0.1"
                      animation__reset="property: scale; startEvents: mouseleave; dur: 100; to: 1 1 1">
            </a-entity>

            <!-- Skis -->
            <a-entity position="0 -0.8 -0.5" rotation="-5 0 0">
              <a-box position="-0.15 0 0" width="0.05" height="0.01" depth="1.5" color="#ff2222"></a-box>
              <a-box position="0.15 0 0" width="0.05" height="0.01" depth="1.5" color="#ff2222"></a-box>
            </a-entity>
          </a-camera>
        </a-entity>
      </a-entity>

      <!-- The Menu Button -->
      <a-entity id="start-node" position="0 0.5 -4" rotation="-15 0 0">
        <a-box id="start-box" 
               class="interactive"
               width="1" height="1" depth="1" 
               color="#ff2222"
               animation="property: rotation; to: 0 360 0; dur: 5000; loop: true; easing: linear">
        </a-box>
        <a-text value="GAZE TO START" position="0 1.2 0" align="center" color="#000" scale="2 2 2"></a-text>
      </a-entity>

      <!-- Scrolling World -->
      <a-entity id="world" rotation="-15 0 0">
        <a-plane id="ground" position="0 -1 -500" rotation="-90 0 0" width="100" height="2000" color="#ffffff"></a-plane>
        
        <!-- Motion lines for speed effect -->
        <a-entity id="motion-lines">
          <!-- These will be created and animated in JS -->
        </a-entity>
      </a-entity>

      <a-light type="ambient" color="#FFF" intensity="0.8"></a-light>
      <a-light type="directional" color="#FFF" intensity="0.8" position="-5 10 10"></a-light>
    </a-scene>

    <script>
      let gameState = 'START';
      let distance = 0;
      let speed = 0.25;
      let playerX = 0;
      let playerY = 0;
      let jumpVelocity = 0;
      const gravity = -0.012;  // Constant downhill pull
      let lastSpawnDistance = 0;  // Track last spawn distance precisely
      let spawnedPositions = [];  // Track spawned obstacle positions
      let keyboardLeft = false;  // Arrow key states
      let keyboardRight = false;
      const keyboardSteering = 0.15;  // Keyboard steering sensitivity      let lastJumpRampHit = -100;  // Track last jump ramp to prevent multiple triggers
      const world = document.getElementById('world');
      const startNode = document.getElementById('start-node');
      const startBox = document.getElementById('start-box');
      const distUI = document.getElementById('distance');
      const msgUI = document.getElementById('msg');
      const camera = document.getElementById('camera');
      const playerContainer = document.getElementById('player-container');
      const motionLines = document.getElementById('motion-lines');
      const desktopStartButton = document.getElementById('desktop-start-button');
      let motionLineOffset = 0;
      
      // Show desktop start button by default
      desktopStartButton.style.display = 'block';

      // VR: Use the 'click' event which is automatically fired by a-frame when fuseTimeout is reached
      startBox.addEventListener('click', function() {
        console.log("Start Box Clicked/Fused!");
        if (gameState !== 'PLAYING') {
          startGame();
        }
      });
      
      // Desktop: Click to start button
      desktopStartButton.addEventListener('click', function() {
        console.log("Desktop Start Button Clicked!");
        if (gameState !== 'PLAYING') {
          startGame();
        }
      });
      
      // Keyboard controls for steering
      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') keyboardLeft = true;
        if (e.key === 'ArrowRight') keyboardRight = true;
      });
      
      document.addEventListener('keyup', function(e) {
        if (e.key === 'ArrowLeft') keyboardLeft = false;
        if (e.key === 'ArrowRight') keyboardRight = false;
      });

      function startGame() {
        gameState = 'PLAYING';
        distance = 0;
        playerX = 0;
        playerY = 0;
        jumpVelocity = 0;
        lastSpawnDistance = 0;
        motionLineOffset = 0;
        spawnedPositions = [];
        
        // Reset world
        world.innerHTML = '<a-plane id="ground" position="0 -1 -500" rotation="-90 0 0" width="100" height="2000" color="#ffffff"></a-plane><a-entity id="motion-lines"></a-entity>';
        world.setAttribute('position', '0 0 0');
        
        // UI
        startNode.setAttribute('visible', 'false');
        startBox.classList.remove('interactive');
        startNode.parentNode.removeChild(startNode);  // Remove start box from scene entirely
        desktopStartButton.style.display = 'none';  // Hide desktop button when game starts
        msgUI.innerText = "ARROW KEYS TO STEER | HIT RAINBOWS TO JUMP";
        
        // Create initial motion lines
        createMotionLines();
      }

      function createMotionLines() {
        const motionLinesEntity = world.querySelector('#motion-lines');
        if (!motionLinesEntity) return;
        
        // Create horizontal lines across the slope for motion effect
        for (let i = 0; i < 20; i++) {
          const line = document.createElement('a-plane');
          line.setAttribute('width', '100');
          line.setAttribute('height', '2');
          line.setAttribute('color', '#f0f0f0');
          line.setAttribute('opacity', '0.3');
          line.setAttribute('position', `0 0 ${-100 + i * 12}`);
          line.setAttribute('rotation', '0 0 0');
          motionLinesEntity.appendChild(line);
        }
      }

      function spawnEntity() {
        // Check if we can spawn (no nearby obstacles)
        const worldZPos = world.getAttribute('position').z || 0;
        let canSpawn = true;
        
        // Clean up old positions
        spawnedPositions = spawnedPositions.filter(pos => pos.z + worldZPos < 20);
        
        // Check spacing - minimum 15 units apart
        const potentialZ = -80 - worldZPos;
        for (let pos of spawnedPositions) {
          if (Math.abs(pos.z - potentialZ) < 15) {
            canSpawn = false;
            break;
          }
        }
        
        if (!canSpawn) return;
        
        const rng = Math.random();
        const obj = document.createElement('a-entity');
        const x = (Math.random() - 0.5) * 28;  // Leave margin on sides
        const z = -80 - worldZPos;
        obj.setAttribute('position', `${x} -1 ${z}`);
        
        spawnedPositions.push({ x: x, z: z });

        if (rng < 0.75) {
          // Tree Obstacle
          const trunk = document.createElement('a-cylinder');
          trunk.setAttribute('radius', '0.15'); 
          trunk.setAttribute('height', '0.6'); 
          trunk.setAttribute('color', '#4b3621');
          obj.appendChild(trunk);
          
          const leaves = document.createElement('a-cone');
          leaves.setAttribute('radius-bottom', '0.8'); 
          leaves.setAttribute('height', '2.5'); 
          leaves.setAttribute('position', '0 1.2 0'); 
          leaves.setAttribute('color', '#1b4d3e');
          obj.appendChild(leaves);
          
          // Add data attributes for collision detection
          obj.setAttribute('data-type', 'obstacle');
          obj.setAttribute('data-width', '1.6');  // Collision width
          obj.setAttribute('data-radius', '0.8');  // Tree radius
          obj.classList.add('obstacle');
        } else {
          // Rainbow Jump
          const colors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#0000ff'];
          colors.forEach((c, i) => {
            const strip = document.createElement('a-box');
            strip.setAttribute('width', '5'); 
            strip.setAttribute('height', '0.2'); 
            strip.setAttribute('depth', '0.4');
            strip.setAttribute('position', `0 0.05 ${i * 0.4}`);
            strip.setAttribute('color', c);
            obj.appendChild(strip);
          });
          
          obj.setAttribute('data-type', 'jump-ramp');
          obj.setAttribute('data-width', '5');
          obj.classList.add('jump-ramp');
        }
        world.appendChild(obj);
      }

      function spawnGroundPlane() {
        // Continuously add ground planes ahead so we always have ground beneath us
        const worldZPos = world.getAttribute('position').z || 0;
        const nextGroundZ = -500 + (Math.floor(worldZPos / 500) + 1) * 500;
        
        // Check if we already have a ground plane at this position
        const existingPlanes = world.querySelectorAll('a-plane[id^="ground-"]');
        let hasNextPlane = false;
        
        existingPlanes.forEach(plane => {
          const pPos = plane.getAttribute('position');
          if (pPos && Math.abs(parseFloat(pPos.z) - nextGroundZ) < 10) {
            hasNextPlane = true;
          }
        });
        
        if (!hasNextPlane) {
          const newPlane = document.createElement('a-plane');
          newPlane.setAttribute('id', `ground-${Math.floor(nextGroundZ)}`);
          newPlane.setAttribute('position', `0 -1 ${nextGroundZ}`);
          newPlane.setAttribute('rotation', '-90 0 0');
          newPlane.setAttribute('width', '100');
          newPlane.setAttribute('height', '2000');
          newPlane.setAttribute('color', '#ffffff');
          world.appendChild(newPlane);
        }
        
        // Clean up old ground planes
        existingPlanes.forEach(plane => {
          const pPos = plane.getAttribute('position');
          if (pPos) {
            const pZ = parseFloat(pPos.z);
            if (worldZPos - pZ > 600) {
              plane.parentNode.removeChild(plane);
            }
          }
        });
      }

      function gameLoop() {
        if (gameState === 'PLAYING') {
          distance += speed;
          distUI.innerText = `Distance: ${Math.floor(distance)}m`;

          // Steering: Combine keyboard and VR head tilt (no bounds - unlimited movement)
          let steerAmount = 0;
          
          // Keyboard steering (arrow keys)
          if (keyboardLeft) steerAmount -= keyboardSteering;
          if (keyboardRight) steerAmount += keyboardSteering;
          
          // VR head tilt steering (if available)
          const rotation = camera.getAttribute('rotation');
          steerAmount -= rotation.z * 0.008;
          
          // Apply steering with NO bounds (unlimited left/right)
          playerX += steerAmount;

          // Gravity always pulls downward (into the hill)
          jumpVelocity += gravity;
          playerY += jumpVelocity;
          
          // Keep player on ground when not jumping
          if (playerY <= 0) {
            playerY = 0;
            jumpVelocity = 0;
          }

          playerContainer.setAttribute('position', `${playerX} ${playerY} 0`);

          // Move the world container
          const wPos = world.getAttribute('position');
          world.setAttribute('position', { x: -playerX, y: 0, z: wPos.z + speed });

          // Update motion line offset for visual effect
          motionLineOffset += speed;
          const motionLinesEntity = world.querySelector('#motion-lines');
          if (motionLinesEntity) {
            const lines = motionLinesEntity.querySelectorAll('a-plane');
            lines.forEach((line, index) => {
              const baseZ = -100 + index * 12;
              const newZ = ((baseZ + motionLineOffset) % 240) - 120;  // Loop every 240 units
              line.setAttribute('position', `0 0 ${newZ}`);
            });
          }

          // Spawn obstacles every 8 units of distance (more frequent!)
          if (distance - lastSpawnDistance > 8) {
            spawnEntity();
            lastSpawnDistance = distance;
          }

          // Keep ground planes spawned ahead as we move
          spawnGroundPlane();

          // Collisions
          const worldZPos = world.getAttribute('position').z;
          
          document.querySelectorAll('.obstacle').forEach(obs => {
            const oPos = obs.getAttribute('position');
            const zRel = oPos.z + worldZPos;
            
            // Collision only happens when obstacle is close and player is low
            // Narrower collision window (was -0.6 to 0.6, now -0.3 to 0.3)
            if (zRel > -0.3 && zRel < 0.3 && playerY < 0.4) {
              const obsWidth = parseFloat(obs.getAttribute('data-radius')) || 0.8;
              if (Math.abs(oPos.x - playerX) < obsWidth + 0.3) {  // Player width safety margin
                endGame("CRASHED INTO TREE!");
              }
            }
            
            // Remove when far behind
            if (zRel > 20) {
              if (obs.parentNode) obs.parentNode.removeChild(obs);
            }
          });

          document.querySelectorAll('.jump-ramp').forEach(ramp => {
            const rPos = ramp.getAttribute('position');
            const zRel = rPos.z + worldZPos;
            
            // Trigger jump when ramp is directly under player
            if (zRel > -0.6 && zRel < 0.4 && playerY < 0.1) {
              const rampWidth = parseFloat(ramp.getAttribute('data-width')) || 5;
              if (Math.abs(rPos.x - playerX) < rampWidth / 2 + 0.5) {
                // Only trigger once per ramp to prevent multiple jumps
                if (Math.abs(rPos.z - lastJumpRampHit) > 5) {
                  jumpVelocity = 0.42;  // Stronger jump velocity
                  lastJumpRampHit = rPos.z;
                  console.log("JUMP!");
                }
              }
            }
            
            // Remove when far behind
            if (zRel > 20) {
              if (ramp.parentNode) ramp.parentNode.removeChild(ramp);
            }
          });
        }
        requestAnimationFrame(gameLoop);
      }

      function endGame(reason) {
        gameState = 'GAMEOVER';
        msgUI.innerHTML = `<span style="color:red; font-size:18px">${reason}</span><br>GAZE AT BOX TO REPLAY`;
        startNode.setAttribute('visible', 'true');
        startBox.classList.add('interactive');
        startNode.setAttribute('position', `${playerX} 0.5 -4`);
      }

      gameLoop();
    </script>
  </body>
</html>
